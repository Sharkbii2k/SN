    /* =========================================================================
       2. HỆ THỐNG ÂM THANH (WEB AUDIO API) & GIỌNG ĐỌC (SPEECH API)
       ========================================================================= */
    let audioCtx = null;
    function getAudioCtx() {
      if (!audioCtx) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (AudioContext) audioCtx = new AudioContext();
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume().catch(() => {});
      }
      return audioCtx;
    }

    function playTone(freq, type, startTime, duration, volume = 0.14) {
      try {
        const ctx = getAudioCtx();
        if (!ctx) return;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, startTime);
        gain.gain.setValueAtTime(0.001, startTime);
        gain.gain.exponentialRampToValueAtTime(volume, startTime + 0.015);
        gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(startTime);
        osc.stop(startTime + duration + 0.02);
      } catch (e) {}
    }

    const SFX = {
      tap() {
        const ctx = getAudioCtx();
        if (!ctx) return;
        playTone(540, 'sine', ctx.currentTime, 0.055, 0.09);
      },
      correct() {
        const ctx = getAudioCtx();
        if (!ctx) return;
        const now = ctx.currentTime;
        playTone(523.25, 'triangle', now, 0.14, 0.16);
        playTone(659.25, 'triangle', now + 0.09, 0.16, 0.16);
        playTone(783.99, 'sine', now + 0.18, 0.28, 0.18);
      },
      wrong() {
        const ctx = getAudioCtx();
        if (!ctx) return;
        const now = ctx.currentTime;
        playTone(196.00, 'sawtooth', now, 0.16, 0.08);
        playTone(155.56, 'sawtooth', now + 0.12, 0.24, 0.09);
      },
      complete() {
        const ctx = getAudioCtx();
        if (!ctx) return;
        const now = ctx.currentTime;
        playTone(523.25, 'triangle', now, 0.12, 0.16);
        playTone(659.25, 'triangle', now + 0.10, 0.12, 0.16);
        playTone(783.99, 'triangle', now + 0.20, 0.14, 0.16);
        playTone(1046.5, 'sine', now + 0.32, 0.42, 0.20);
      }
    };

    function speakText(text, lang = 'en-US', slow = false) {
      try {
        if (!('speechSynthesis' in window)) return;
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(text);
        utter.lang = lang;
        utter.rate = slow ? 0.65 : 1.0;
        const voices = window.speechSynthesis.getVoices();
        if (voices && voices.length) {
          const prefix = lang.slice(0, 2).toLowerCase();
          const matched = voices.find(v => v.lang && v.lang.toLowerCase().startsWith(prefix));
          if (matched) utter.voice = matched;
        }
        window.speechSynthesis.speak(utter);
      } catch (e) {}
    }

    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
    }

    function shuffleArray(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function normalizeEnglish(str) {
      return String(str || '')
        .toLowerCase()
        .replace(/’/g, "'")
        .replace(/\bi'm\b/g, 'i am')
        .replace(/\byou're\b/g, 'you are')
        .replace(/\bwe're\b/g, 'we are')
        .replace(/\bthey're\b/g, 'they are')
        .replace(/\bit's\b/g, 'it is')
        .replace(/\bthat's\b/g, 'that is')
        .replace(/\bwhat's\b/g, 'what is')
        .replace(/\bdon't\b/g, 'do not')
        .replace(/\bdoesn't\b/g, 'does not')
        .replace(/\bdidn't\b/g, 'did not')
        .replace(/\bcan't\b/g, 'cannot')
        .replace(/\bwon't\b/g, 'will not')
        .replace(/\bi'd\b/g, 'i would')
        .replace(/\bi'll\b/g, 'i will')
        .replace(/[^a-z0-9\s]/g, ' ')
        .replace(/\s+/g, ' ')
        .trim();
    }

    function normalizeChinese(str) {
      return String(str || '')
        .replace(/[\s，。？！、；：“”‘’（）().,?!'"\-—…·]/g, '')
        .replace(/哪儿/g, '哪里')
        .trim();
    }

    function fallbackEnglishTiles(en) {
      return String(en || '')
        .replace(/[.,?!:;"'()]/g, ' ')
        .split(/\s+/)
        .map(w => w.trim())
        .filter(Boolean);
    }

    function fallbackChineseTiles(zh) {
      const clean = normalizeChinese(zh);
      if (!clean) return [];
      const tiles = [];
      for (let i = 0; i < clean.length; i += 2) {
        tiles.push(clean.slice(i, i + 2));
      }
      return tiles;
    }

    function getSuggestedCefr() {
      // Tìm cấp độ đầu tiên từ A1 -> C2 chưa có bài hoặc có ít hơn 6 chủ đề
      for (const lvl of CEFR_LEVELS) {
        const topics = state.curriculum[lvl] || [];
        if (topics.length < 6) return lvl;
      }
      // Nếu tất cả đều >= 6 chủ đề, chọn cấp độ có tổng số câu ít nhất
      let minLvl = 'A1';
      let minCount = Infinity;
      for (const lvl of CEFR_LEVELS) {
        const total = (state.curriculum[lvl] || []).reduce((sum, t) => sum + t.sentences.length, 0);
        if (total < minCount) {
          minCount = total;
          minLvl = lvl;
        }
      }
      return minLvl;
    }

    function generateDynamicPrompt() {
      const targetCefr = state.importModal.targetCefr;
      const targetTopicRaw = state.importModal.targetTopic.trim();
      const count = state.importModal.sentenceCount || 7;

      // 1. Thống kê toàn bộ dữ liệu hiện có từ A1 đến C2
      const overviewLines = CEFR_LEVELS.map(lvl => {
        const topics = state.curriculum[lvl] || [];
        const sentCount = topics.reduce((acc, t) => acc + t.sentences.length, 0);
        return `- Trình độ ${lvl}: ${topics.length} chủ đề (${sentCount} câu)`;
      }).join('\n');

      // 2. Danh sách chủ đề & câu đã có ở trình độ mục tiêu
      const levelTopics = state.curriculum[targetCefr] || [];
      const existingTopicSummary = levelTopics.length > 0
        ? levelTopics.map(t => `"${t.title}" (${t.sentences.length} câu)`).join(', ')
        : 'Chưa có chủ đề nào';

      // Tìm xem người dùng có đang nhắm vào một chủ đề đã tồn tại hay không
      const matchedTopic = targetTopicRaw
        ? levelTopics.find(t => t.title.toLowerCase().trim() === targetTopicRaw.toLowerCase())
        : null;

      // Thu thập danh sách câu cần tránh trùng lặp
      let existingSentencesText = '';
      if (matchedTopic) {
        existingSentencesText = `Chủ đề "${matchedTopic.title}" (${targetCefr}) đã có ${matchedTopic.sentences.length} câu sau (TUYỆT ĐỐI KHÔNG SOẠN TRÙNG):\n` +
          matchedTopic.sentences.map((s, i) => `${i + 1}. ${s.en} | ${s.zh}`).join('\n');
      } else if (levelTopics.length > 0) {
        const allLevelSents = [];
        levelTopics.forEach(t => {
          t.sentences.forEach(s => allLevelSents.push(`[${t.title}] ${s.en} | ${s.zh}`));
        });
        existingSentencesText = `Các câu đã có ở trình độ ${targetCefr} (KHÔNG ĐƯỢC LẶP LẠI):\n` +
          allLevelSents.map((line, i) => `${i + 1}. ${line}`).join('\n');
      } else {
        existingSentencesText = `Trình độ ${targetCefr} hiện chưa có câu nào. Hãy soạn mới hoàn toàn.`;
      }

      const topicInstruction = targetTopicRaw
        ? `Chủ đề mục tiêu: "${targetTopicRaw}" (giữ nguyên chính xác tên chủ đề này ở trường "topicTitle").`
        : `Chủ đề mục tiêu: Hãy tự đề xuất 1 chủ đề giao tiếp thực tế mới phù hợp trình độ ${targetCefr} (KHÔNG trùng với các chủ đề đã có: ${existingTopicSummary}).`;

      return `Bạn là chuyên gia biên soạn giáo trình song ngữ Anh – Trung theo phong cách Duolingo.
Hãy soạn ${count} mẫu câu luyện dịch hai chiều (Anh <-> Trung) kèm từ vựng trọng tâm theo yêu cầu sau:

1. MỤC TIÊU NỘI DUNG:
- Trình độ Tiếng Anh chuẩn CEFR: ${targetCefr} (${CEFR_LABELS[targetCefr]}). Từ vựng và ngữ pháp tiếng Anh phải đúng chuẩn cấp độ ${targetCefr}.
- Tiếng Trung: Chữ Hán giản thể tự nhiên, sát nghĩa ngữ cảnh thực tế (không giới hạn cấp độ HSK), kèm Pinyin có dấu thanh chuẩn xác.
- ${topicInstruction}

2. HIỆN TRẠNG DỮ LIỆU ĐANG CÓ TRONG ỨNG DỤNG:
${overviewLines}
- Các chủ đề đã có ở ${targetCefr}: ${existingTopicSummary}.

3. DANH SÁCH CÂU ĐÃ TỒN TẠI (BẮT BUỘC TRÁNH TRÙNG LẶP):

    function importFromGemini() {
      const raw = (state.importModal.pasteText || '').trim();
      if (!raw) {
        SFX.wrong();
        state.importModal.status = {
          type: 'error',
          text: 'Bạn chưa dán nội dung từ Gemini vào ô bên trên.'
        };
        render();
        return;
      }

      try {
        // 1. Lọc bỏ thẻ markdown ```json ... ``` và văn bản thừa xung quanh
        let cleaned = raw
          .replace(/^```(?:json)?\s*/i, '')
          .replace(/```\s*$/i, '')
          .trim();

        const firstBrace = cleaned.indexOf('{');
        const lastBrace = cleaned.lastIndexOf('}');
        if (firstBrace === -1 || lastBrace === -1 || lastBrace <= firstBrace) {
          throw new Error('Không tìm thấy cấu trúc dữ liệu hợp lệ.');
        }
        cleaned = cleaned.slice(firstBrace, lastBrace + 1);

        const parsed = JSON.parse(cleaned);

        // 2. Xác định cấp độ CEFR & Chủ đề đích
        const rawCefr = String(parsed.cefr || state.importModal.targetCefr).toUpperCase().trim();
        const targetCefr = CEFR_LEVELS.includes(rawCefr) ? rawCefr : state.importModal.targetCefr;

        const topicTitle = String(
          parsed.topicTitle || state.importModal.targetTopic || 'Chủ đề mở rộng'
        ).trim();

        const topicIcon = String(parsed.topicIcon || '📘').trim() || '📘';

        if (!Array.isArray(parsed.sentences) || parsed.sentences.length === 0) {
          throw new Error('Dữ liệu chưa có danh sách câu ("sentences").');
        }

        // 3. Chuẩn hóa danh sách câu & từ vựng đầu vào
        const incomingSentences = [];
        for (const item of parsed.sentences) {
          if (!item || !item.en || !item.zh) continue;
          const en = String(item.en).trim();
          const zh = String(item.zh).trim();
          const py = String(item.py || '').trim();
          const vi = String(item.vi || '').trim();

          const enTiles = Array.isArray(item.enTiles) && item.enTiles.length > 0
            ? item.enTiles.map(t => String(t).trim()).filter(Boolean)
            : fallbackEnglishTiles(en);

          const zhTiles = Array.isArray(item.zhTiles) && item.zhTiles.length > 0
            ? item.zhTiles.map(t => String(t).trim()).filter(Boolean)
            : fallbackChineseTiles(zh);

          const rawZhPy = Array.isArray(item.zhTilePy) ? item.zhTilePy : [];
          const zhTilePy = zhTiles.map((_, idx) => String(rawZhPy[idx] || '').trim());

          if (enTiles.length > 0 && zhTiles.length > 0) {
            incomingSentences.push({ en, zh, py, vi, enTiles, zhTiles, zhTilePy });
          }
        }

        if (incomingSentences.length === 0) {
          throw new Error('Không trích xuất được mẫu câu hợp lệ nào.');
        }

        const incomingVocab = Array.isArray(parsed.vocab)
          ? parsed.vocab
              .filter(v => v && v.en && v.zh)
              .map(v => ({
                en: String(v.en).trim(),
                zh: String(v.zh).trim(),
                py: String(v.py || '').trim(),
                vi: String(v.vi || '').trim()
              }))
          : [];

        // 4. Tìm chủ đề trùng tên ở cùng cấp độ CEFR hoặc tạo chủ đề mới
        const levelTopics = state.curriculum[targetCefr];
        let existingTopic = levelTopics.find(
          t => t.title.toLowerCase().trim() === topicTitle.toLowerCase()
        );

        // Tạo tập kiểm tra trùng lặp toàn cấp độ
        const existingEnSet = new Set();
        const existingZhSet = new Set();
        levelTopics.forEach(t => {
          t.sentences.forEach(s => {
            existingEnSet.add(normalizeEnglish(s.en));
            existingZhSet.add(normalizeChinese(s.zh));
          });
        });

        const uniqueNewSentences = [];
        let duplicateCount = 0;

        for (const s of incomingSentences) {
          const normEn = normalizeEnglish(s.en);
          const normZh = normalizeChinese(s.zh);
          if (existingEnSet.has(normEn) || existingZhSet.has(normZh)) {
            duplicateCount += 1;
          } else {
            existingEnSet.add(normEn);
            existingZhSet.add(normZh);
            uniqueNewSentences.push(s);
          }
        }

        if (existingTopic) {
          existingTopic.sentences.push(...uniqueNewSentences);
          const vocabSeen = new Set((existingTopic.vocab || []).map(v => v.en.toLowerCase()));
          if (!existingTopic.vocab) existingTopic.vocab = [];
          for (const v of incomingVocab) {
            if (!vocabSeen.has(v.en.toLowerCase())) {
              vocabSeen.add(v.en.toLowerCase());
              existingTopic.vocab.push(v);
            }
          }
        } else {
          if (uniqueNewSentences.length === 0) {
            throw new Error('Tất cả các câu vừa dán đều đã tồn tại trong trình độ này.');
          }
          const color = TOPIC_COLORS[levelTopics.length % TOPIC_COLORS.length];
          levelTopics.push({
            id: `${targetCefr.toLowerCase()}_${Date.now().toString(36)}`,
            title: topicTitle,
            icon: topicIcon,
            color,
            vocab: incomingVocab,
            sentences: uniqueNewSentences
          });
        }

        // 5. Lưu bền vững & cập nhật ngay Prompt mới ở Bước 2
        persistState();
        SFX.complete();

        state.cefr = targetCefr;
        state.importModal.targetCefr = targetCefr;
        state.importModal.targetTopic = topicTitle;
        state.importModal.pasteText = '';
        state.importModal.copied = false;

        const dupNote = duplicateCount > 0 ? ` (đã lọc bỏ ${duplicateCount} câu trùng)` : '';
        state.importModal.status = {
          type: 'success',
          text: `Đã nạp thêm ${uniqueNewSentences.length} câu mới vào [${targetCefr}] ${topicTitle}${dupNote}! Prompt ở Bước 2 đã tự động cập nhật.`
        };
        render();
      } catch (err) {
        SFX.wrong();
        state.importModal.status = {
          type: 'error',
          text: `Chưa thể nạp dữ liệu: ${err.message || 'Nội dung dán chưa đúng định dạng.'}`
        };
        render();
      }
    }

    function exportBackupData() {
      SFX.tap();
      try {
        const backupObj = {
          exportedAt: new Date().toISOString(),
          xp: state.xp,
          streak: state.streak,
          stars: state.stars,
          curriculum: state.curriculum
        };
        const blob = new Blob([JSON.stringify(backupObj, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `song-ngu-anh-trung-backup-${new Date().toISOString().slice(0, 10)}.json`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);

        state.importModal.status = {
          type: 'success',
          text: 'Đã tải xuống tệp sao lưu toàn bộ bài học & tiến độ!'
        };
        render();
      } catch (e) {}
    }

    function handleResetDefault() {
      if (!state.importModal.confirmReset) {
        SFX.tap();
        state.importModal.confirmReset = true;
        render();
        return;
      }
      SFX.correct();
      state.curriculum = cloneDefaultCurriculum();
      state.stars = {};
      state.xp = 0;
      state.cefr = 'A1';
      state.importModal.confirmReset = false;
      state.importModal.targetCefr = getSuggestedCefr();
      state.importModal.targetTopic = '';
      state.importModal.status = {
        type: 'success',
        text: 'Đã khôi phục toàn bộ dữ liệu bài học gốc ban đầu!'
      };
      persistState();
      render();
    }

    /* =========================================================================
       6. LOGIC PHIÊN LUYỆN TẬP (DỊCH HAI CHIỀU ANH <-> TRUNG)
       ========================================================================= */
    function buildLessonQuestions(cefr, topic) {
      const items = topic.sentences;
      const allEnPool = [];
      const allZhPool = [];

      // Lấy từ gây nhiễu từ toàn bộ cấp độ để đa dạng
      (state.curriculum[cefr] || [topic]).forEach(t => {
        t.sentences.forEach(item => {
          item.enTiles.forEach(w => allEnPool.push(w));
          item.zhTiles.forEach((w, idx) => {
            allZhPool.push({ text: w, py: (item.zhTilePy && item.zhTilePy[idx]) || '' });
          });
        });
      });

      const shuffledItems = shuffleArray(items);
      return shuffledItems.map((item, idx) => {
        const direction = idx % 2 === 0 ? 'EN_TO_ZH' : 'ZH_TO_EN';

        if (direction === 'EN_TO_ZH') {
          const correctTiles = item.zhTiles.map((text, i) => ({
            id: `c_${i}_${Math.random().toString(36).slice(2, 6)}`,
            text,
            py: (item.zhTilePy && item.zhTilePy[i]) || '',
            used: false
          }));
          const seen = new Set(item.zhTiles);
          const uniqueDistractors = [];
          for (const cand of shuffleArray(allZhPool)) {
            if (!seen.has(cand.text) && uniqueDistractors.length < 3) {
              seen.add(cand.text);
              uniqueDistractors.push({
                id: `d_${uniqueDistractors.length}_${Math.random().toString(36).slice(2, 6)}`,
                text: cand.text,
                py: cand.py,
                used: false
              });
            }
          }
          return {
            direction,
            promptText: item.en,
            promptSub: '',
            viHint: item.vi || '',
            promptLang: 'en-US',
            answerLang: 'zh-CN',
            expectedText: item.zh,
            expectedSub: item.py,
            bank: shuffleArray([...correctTiles, ...uniqueDistractors])
          };
        } else {
          const correctTiles = item.enTiles.map((text, i) => ({
            id: `c_${i}_${Math.random().toString(36).slice(2, 6)}`,
            text,
            py: '',
            used: false
          }));
          const seen = new Set(item.enTiles.map(x => x.toLowerCase()));
          const uniqueDistractors = [];
          for (const cand of shuffleArray(allEnPool)) {
            if (!seen.has(cand.toLowerCase()) && uniqueDistractors.length < 3) {
              seen.add(cand.toLowerCase());
              uniqueDistractors.push({
                id: `d_${uniqueDistractors.length}_${Math.random().toString(36).slice(2, 6)}`,
                text: cand,
                py: '',
                used: false
              });
            }
          }
          return {
            direction,
            promptText: item.zh,
            promptSub: item.py,
            viHint: item.vi || '',
            promptLang: 'zh-CN',
            answerLang: 'en-US',
            expectedText: item.en,
            expectedSub: '',
            bank: shuffleArray([...correctTiles, ...uniqueDistractors])
          };
        }
      });
    }

    function startLesson(topicId) {
      const topic = (state.curriculum[state.cefr] || []).find(t => t.id === topicId);
      if (!topic || !topic.sentences || topic.sentences.length === 0) return;

      SFX.tap();
      state.vocabModal.topicId = null;
      const questions = buildLessonQuestions(state.cefr, topic);

      state.screen = 'lesson';
      state.lesson = {
        topicId: topic.id,
        topicTitle: topic.title,
        questions,
        currentIndex: 0,
        hearts: 5,
        correctCount: 0,
        sessionXp: 0,
        inputMode: 'bank',
        selectedTiles: [],
        bankTiles: questions[0].bank.map(t => ({ ...t, used: false })),
        typedAnswer: '',
        feedback: null,
        outOfHearts: false
      };
      render();
      setTimeout(() => {
        const q = state.lesson.questions[0];
        if (q) speakText(q.promptText, q.promptLang, false);
      }, 220);
    }

    function exitLesson() {
      SFX.tap();
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      state.screen = 'home';
      render();
    }

    function selectBankTile(tileId) {
      if (state.lesson.feedback || state.lesson.outOfHearts) return;
      const tile = state.lesson.bankTiles.find(t => t.id === tileId);
      if (!tile || tile.used) return;
      SFX.tap();
      const q = state.lesson.questions[state.lesson.currentIndex];
      speakText(tile.text, q.answerLang, false);
      tile.used = true;
      state.lesson.selectedTiles.push({ id: tile.id, text: tile.text, py: tile.py });
      render();
    }

    function unselectAnswerTile(tileId) {
      if (state.lesson.feedback || state.lesson.outOfHearts) return;
      SFX.tap();
      state.lesson.selectedTiles = state.lesson.selectedTiles.filter(t => t.id !== tileId);
      const bankTile = state.lesson.bankTiles.find(t => t.id === tileId);
      if (bankTile) bankTile.used = false;
      render();
    }

    function toggleInputMode() {
      if (state.lesson.feedback || state.lesson.outOfHearts) return;
      SFX.tap();
      state.lesson.inputMode = state.lesson.inputMode === 'bank' ? 'type' : 'bank';
      render();
      if (state.lesson.inputMode === 'type') {
        setTimeout(() => {
          const inp = document.getElementById('answer-input');
          if (inp) inp.focus();
        }, 50);
      }
    }

    function updateTypedAnswer(val) {
      state.lesson.typedAnswer = val;
      const btn = document.getElementById('check-btn');
      if (btn) {
        const hasVal = val.trim().length > 0;
        btn.disabled = !hasVal;
        btn.className = hasVal
          ? 'w-full py-3.5 rounded-2xl font-extrabold text-base tracking-wide uppercase text-white bg-[#58CC02] border-b-4 border-[#58A700] active:border-b-0 active:translate-y-1 transition-all shadow-sm'
          : 'w-full py-3.5 rounded-2xl font-extrabold text-base tracking-wide uppercase text-slate-400 bg-slate-200 border-b-4 border-slate-300 cursor-not-allowed transition-all';
      }
    }

    function checkAnswer() {
      const lesson = state.lesson;
      if (lesson.feedback || lesson.outOfHearts) return;
      const q = lesson.questions[lesson.currentIndex];

      let userRaw = '';
      if (lesson.inputMode === 'bank') {
        if (lesson.selectedTiles.length === 0) return;
        userRaw = q.direction === 'EN_TO_ZH'
          ? lesson.selectedTiles.map(t => t.text).join('')
          : lesson.selectedTiles.map(t => t.text).join(' ');
      } else {
        userRaw = lesson.typedAnswer.trim();
        if (!userRaw) return;
      }

      const isCorrect = q.direction === 'EN_TO_ZH'
        ? normalizeChinese(userRaw) === normalizeChinese(q.expectedText)
        : normalizeEnglish(userRaw) === normalizeEnglish(q.expectedText);

      if (isCorrect) {
        SFX.correct();
        lesson.correctCount += 1;
        lesson.sessionXp += 15;
        speakText(q.expectedText, q.answerLang, false);
        lesson.feedback = {
          isCorrect: true,
          correctDisplay: q.expectedText,
          correctSub: q.expectedSub
        };
      } else {
        SFX.wrong();
        lesson.hearts = Math.max(0, lesson.hearts - 1);
        lesson.feedback = {
          isCorrect: false,
          correctDisplay: q.expectedText,
          correctSub: q.expectedSub
        };
      }
      render();
    }

    function continueLesson() {
      const lesson = state.lesson;
      if (!lesson.feedback) return;

      if (lesson.hearts === 0) {
        lesson.feedback = null;
        lesson.outOfHearts = true;
        render();
        return;
      }

      SFX.tap();
      if (lesson.currentIndex + 1 < lesson.questions.length) {
        lesson.currentIndex += 1;
        const nextQ = lesson.questions[lesson.currentIndex];
        lesson.selectedTiles = [];
        lesson.bankTiles = nextQ.bank.map(t => ({ ...t, used: false }));
        lesson.typedAnswer = '';
        lesson.feedback = null;
        render();
        setTimeout(() => speakText(nextQ.promptText, nextQ.promptLang, false), 200);
      } else {
        SFX.complete();
        const earnedXp = lesson.sessionXp + 10;
        lesson.sessionXp = earnedXp;
        state.xp += earnedXp;

        const key = `${state.cefr}_${lesson.topicId}`;
        const acc = Math.round((lesson.correctCount / lesson.questions.length) * 100);
        const newStars = acc >= 90 ? 3 : acc >= 70 ? 2 : 1;
        state.stars[key] = Math.max(state.stars[key] || 0, newStars);

        persistState();
        state.screen = 'complete';
        render();
      }
    }

    function refillHearts() {
      SFX.correct();
      state.lesson.hearts = 5;
      state.lesson.outOfHearts = false;
      state.lesson.selectedTiles = [];
      const q = state.lesson.questions[state.lesson.currentIndex];
      state.lesson.bankTiles = q.bank.map(t => ({ ...t, used: false }));
      state.lesson.typedAnswer = '';
      render();
    }

              <div class="grid grid-cols-2 gap-1.5 p-1 bg-slate-100 rounded-xl">

            <div class="flex-1 min-h-0 overflow-y-auto thin-scroll p-3 space-y-2">

                      <div class="p-3 rounded-2xl border border-slate-200 bg-slate-50/70 flex items-center justify-between gap-2">
                        <div class="min-w-0">
                          <div class="flex items-baseline gap-2 flex-wrap">
                            <span class="font-extrabold text-sm text-slate-800">${v.en}</span>
                            <span class="font-zh font-bold text-base text-[#1899D6]">${v.zh}</span>
                            ${state.showPinyin && v.py ? `<span class="text-xs font-semibold text-slate-400">(${v.py})</span>` : ''}

                          ${v.vi ? `<div class="text-xs font-semibold text-slate-500 mt-0.5">${v.vi}</div>` : ''}

                        <div class="flex items-center gap-1 shrink-0">

                                  onclick="speakText('${v.en.replace(/'/g, "\\'")}', 'en-US', false)"

                            🇬🇧 🔊
                          </button>
                          <button type="button"
                                  onclick="speakText('${v.zh.replace(/'/g, "\\'")}', 'zh-CN', false)"
                                  class="px-2 py-1.5 rounded-lg bg-white border border-slate-200 text-[11px] font-bold active:scale-95">
                            🇨🇳 🔊
                          </button>
                        </div>
                      </div>
                    `).join('')
                  : `<div class="text-center py-8 text-xs font-semibold text-slate-400">Chủ đề này chưa có thẻ từ vựng riêng. Xem tab Mẫu câu nhé!</div>`
              ) : (
                sentenceList.map(item => `
                  <div class="p-3 rounded-2xl border border-slate-200 bg-slate-50/70 flex flex-col gap-1.5">
                    <div class="flex items-start justify-between gap-2">
                      <div class="font-bold text-sm text-slate-800">${item.en}</div>
                      <button type="button"
                              onclick="speakText('${item.en.replace(/'/g, "\\'")}', 'en-US', false)"
                              class="w-7 h-7 rounded-lg bg-white border border-slate-200 text-xs flex items-center justify-center shrink-0 active:scale-95">
                        🔊
                      </button>
                    </div>
                    <div class="flex items-start justify-between gap-2">
                      <div>
                        <div class="font-zh font-bold text-base text-[#1899D6]">${item.zh}</div>
                        ${state.showPinyin && item.py ? `<div class="text-xs font-semibold text-slate-400">${item.py}</div>` : ''}
                      </div>
                      <button type="button"
                              onclick="speakText('${item.zh.replace(/'/g, "\\'")}', 'zh-CN', false)"
                              class="w-7 h-7 rounded-lg bg-white border border-slate-200 text-xs flex items-center justify-center shrink-0 active:scale-95">
                        🔊
                      </button>
                    </div>
                    ${item.vi ? `<div class="text-xs font-semibold text-emerald-700 bg-emerald-50/80 px-2.5 py-1 rounded-lg">${item.vi}</div>` : ''}

            <!-- Thanh nút hành động dưới đáy -->
            <div class="shrink-0 p-3 border-t border-slate-100 bg-white flex gap-2">
              <button type="button"
                      onclick="closeVocabModal(); openImportModal('${state.cefr}', '${topic.title.replace(/'/g, "\\'")}')"
                      class="px-3.5 py-3 rounded-2xl font-extrabold text-xs uppercase tracking-wide text-[#1899D6] bg-sky-50 border-2 border-b-4 border-sky-200 active:border-b-2 active:translate-y-0.5 transition-all shrink-0">
                + Thêm câu
              </button>
              <button type="button"
                      onclick="startLesson('${topic.id}')"
                      class="flex-1 py-3 rounded-2xl font-extrabold text-xs uppercase tracking-wide text-white bg-[#58CC02] border-b-4 border-[#58A700] active:border-b-0 active:translate-y-1 transition-all">
                Bắt đầu luyện tập
              </button>
            </div>
          </div>
        </div>

    }

    function renderImportModal() {
      const m = state.importModal;
      const existingTopics = state.curriculum[m.targetCefr] || [];
      const currentPrompt = generateDynamicPrompt();
      const totalAllSentences = CEFR_LEVELS.reduce(
        (sum, lvl) => sum + (state.curriculum[lvl] || []).reduce((s, t) => s + t.sentences.length, 0),
        0
      );

      return `
        <div class="absolute inset-0 z-40 bg-slate-900/55 backdrop-blur-[1px] flex flex-col justify-end sm:justify-center p-4 animate-pop">
          <div class="bg-white w-full max-h-[90dvh] rounded-3xl border-2 border-slate-200 shadow-2xl flex flex-col overflow-hidden">
            <!-- Tiêu đề hộp thoại -->
            <div class="shrink-0 px-4 py-3 border-b border-slate-100 flex items-center justify-between gap-2 bg-slate-50/70">
              <div>
                <h2 class="font-extrabold text-sm text-slate-800">Soạn & Nạp bài học mới</h2>
                <p class="text-[11px] font-bold text-slate-400">Kho hiện tại: ${totalAllSentences} câu luyện dịch</p>
              </div>
              <button type="button"
                      onclick="closeImportModal()"
                      class="w-8 h-8 rounded-xl bg-white border border-slate-200 hover:bg-slate-100 text-slate-600 font-extrabold flex items-center justify-center">
                ✕
              </button>
            </div>

            <!-- Thân cuộn 3 bước trực quan -->
            <div class="flex-1 min-h-0 overflow-y-auto thin-scroll p-4 space-y-4">
              ${m.status ? `
                <div class="p-3 rounded-2xl border-2 text-xs font-bold leading-relaxed animate-pop ${
                  m.status.type === 'success'
                    ? 'bg-[#D7FFB8] border-[#b8f28b] text-[#468700]'
                    : 'bg-[#FFDFE0] border-[#ffc1c3] text-[#c92020]'
                }">
                  ${m.status.type === 'success' ? '🎉 ' : '⚠️ '}${m.status.text}
                </div>
              ` : ''}

              <!-- BƯỚC 1: Tùy chọn mục tiêu -->
              <div class="rounded-2xl border-2 border-slate-200 p-3 space-y-2.5">
                <div class="flex items-center justify-between gap-2">
                  <span class="text-xs font-extrabold text-slate-800">
                    <span class="inline-flex items-center justify-center w-5 h-5 rounded-full bg-[#1CB0F6] text-white text-[11px] mr-1">1</span>
                    Chọn mục tiêu soạn bài
                  </span>
                  <button type="button"
                          onclick="suggestNextTarget()"
                          class="px-2.5 py-1 rounded-xl bg-sky-50 hover:bg-sky-100 text-[#1899D6] border border-sky-200 text-[11px] font-extrabold transition-colors">
                    ✨ Tự động đề xuất
                  </button>
                </div>

                <!-- Chọn cấp độ CEFR -->
                <div class="grid grid-cols-6 gap-1">
                  ${CEFR_LEVELS.map(lvl => {
                    const active = m.targetCefr === lvl;
                    return `
                      <button type="button"
                              onclick="setImportCefr('${lvl}')"
                              class="py-1.5 rounded-xl font-display font-extrabold text-xs border-2 transition-all ${
                                active
                                  ? 'bg-[#1CB0F6] border-[#1899D6] text-white'
                                  : 'bg-slate-50 border-slate-200 text-slate-600 hover:border-slate-300'
                              }">
                        ${lvl}
                      </button>
                    `;
                  }).join('')}
                </div>

                <!-- Chọn chủ đề có sẵn hoặc nhập tên chủ đề mới -->
                <div>
                  <input type="text"
                         value="${m.targetTopic.replace(/"/g, '&quot;')}"
                         oninput="updateImportTopicInput(this.value)"
                         placeholder="Nhập tên chủ đề (hoặc để trống để tự tạo mới)..."
                         class="w-full px-3 py-2 rounded-xl border-2 border-slate-200 focus:border-[#1CB0F6] text-xs font-bold text-slate-800 outline-none" />
                </div>

                ${existingTopics.length > 0 ? `
                  <div class="flex flex-wrap gap-1">
                    <button type="button"
                            onclick="setImportTopic('')"
                            class="px-2 py-1 rounded-lg text-[10px] font-extrabold border transition-colors ${
                              m.targetTopic === ''
                                ? 'bg-emerald-50 border-[#58CC02] text-[#58A700]'
                                : 'bg-slate-50 border-slate-200 text-slate-500'
                            }">
                      + Chủ đề mới
                    </button>
                    ${existingTopics.map(t => `
                      <button type="button"
                              onclick="setImportTopic('${t.title.replace(/'/g, "\\'")}')"
                              class="px-2 py-1 rounded-lg text-[10px] font-extrabold border transition-colors ${
                                m.targetTopic.trim().toLowerCase() === t.title.toLowerCase()
                                  ? 'bg-sky-50 border-[#1CB0F6] text-[#1899D6]'
                                  : 'bg-slate-50 border-slate-200 text-slate-600'
                              }">
                        ${t.icon} ${t.title} (${t.sentences.length})
                      </button>
                    `).join('')}
                  </div>
                ` : ''}

                <!-- Số lượng câu mỗi lần soạn -->
                <div class="flex items-center justify-between pt-0.5">
                  <span class="text-[11px] font-bold text-slate-500">Số lượng câu muốn soạn:</span>
                  <div class="flex gap-1">
                    ${[5, 7, 10].map(n => `
                      <button type="button"
                              onclick="setImportSentenceCount(${n})"
                              class="px-2.5 py-1 rounded-lg text-[11px] font-extrabold border ${
                                m.sentenceCount === n
                                  ? 'bg-amber-50 border-[#FFC800] text-amber-700'
                                  : 'bg-slate-50 border-slate-200 text-slate-500'
                              }">
                        ${n} câu
                      </button>
                    `).join('')}
                  </div>
                </div>
              </div>

              <!-- BƯỚC 2: Prompt thông minh tự cập nhật -->
              <div class="rounded-2xl border-2 border-slate-200 p-3 space-y-2">
                <div class="flex items-center justify-between gap-2">
                  <span class="text-xs font-extrabold text-slate-800">
                    <span class="inline-flex items-center justify-center w-5 h-5 rounded-full bg-[#1CB0F6] text-white text-[11px] mr-1">2</span>
                    Câu lệnh soạn bài (tự cập nhật)
                  </span>
                  <span class="text-[10px] font-bold text-emerald-600 bg-emerald-50 px-2 py-0.5 rounded-lg">
                    Đã lọc trùng câu cũ
                  </span>
                </div>

                <textarea id="dynamic-prompt-box"
                          readonly
                          rows="4"
                          class="w-full rounded-xl border border-slate-200 bg-slate-50 p-2.5 text-[11px] font-medium text-slate-600 resize-none outline-none thin-scroll leading-relaxed">${currentPrompt}</textarea>

                <button type="button"
                        onclick="copyDynamicPrompt()"
                        class="w-full py-2.5 rounded-2xl font-extrabold text-xs uppercase tracking-wide text-white transition-all ${
                          m.copied
                            ? 'bg-[#58CC02] border-b-4 border-[#58A700]'
                            : 'bg-[#1CB0F6] border-b-4 border-[#1899D6] active:border-b-0 active:translate-y-0.5'
                        }">
                  ${m.copied ? '✓ Đã chép! Hãy dán vào Gemini' : '📋 Sao chép Prompt'}
                </button>
              </div>

              <!-- BƯỚC 3: Dán kết quả từ Gemini & Nạp vào bài học -->
              <div class="rounded-2xl border-2 border-slate-200 p-3 space-y-2">
                <div class="text-xs font-extrabold text-slate-800">
                  <span class="inline-flex items-center justify-center w-5 h-5 rounded-full bg-[#58CC02] text-white text-[11px] mr-1">3</span>
                  Dán kết quả từ Gemini & Nạp bài
                </div>

                <textarea rows="3"
                          oninput="updatePasteText(this.value)"
                          placeholder="Dán toàn bộ câu trả lời từ Gemini vào đây..."
                          class="w-full rounded-xl border-2 border-slate-200 focus:border-[#58CC02] bg-white p-2.5 text-xs font-medium text-slate-700 resize-none outline-none thin-scroll">${m.pasteText}</textarea>

                <button type="button"
                        onclick="importFromGemini()"
                        class="w-full py-3 rounded-2xl font-extrabold text-xs uppercase tracking-wide text-white bg-[#58CC02] border-b-4 border-[#58A700] active:border-b-0 active:translate-y-1 transition-all shadow-sm">
                  ⚡ Nạp vào bài học
                </button>
              </div>

              <!-- Tiện ích Sao lưu & Khôi phục dữ liệu -->
              <div class="pt-1 pb-2 flex items-center justify-between gap-2">
                <button type="button"
                        onclick="exportBackupData()"
                        class="px-3 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-600 text-[11px] font-extrabold transition-colors">
                  📤 Sao lưu dữ liệu
                </button>

                <button type="button"
                        onclick="handleResetDefault()"
                        class="px-3 py-2 rounded-xl text-[11px] font-extrabold transition-colors ${
                          m.confirmReset
                            ? 'bg-[#FF4B4B] text-white'
                            : 'bg-slate-100 hover:bg-rose-50 text-slate-500 hover:text-[#EA2B2B]'
                        }">
                  ${m.confirmReset ? '⚠️ Bấm lần nữa để khôi phục' : '🔄 Khôi phục mặc định'}
                </button>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function renderLesson() {
      const lesson = state.lesson;
      const q = lesson.questions[lesson.currentIndex];
      const progressPct = Math.round(
        ((lesson.currentIndex + (lesson.feedback && lesson.feedback.isCorrect ? 1 : 0)) / lesson.questions.length) * 100
      );
      const isEnToZh = q.direction === 'EN_TO_ZH';

      const hasAnswer = lesson.inputMode === 'bank'
        ? lesson.selectedTiles.length > 0
        : lesson.typedAnswer.trim().length > 0;

      const selectedTilesHtml = lesson.selectedTiles.map(tile => `
        <button type="button"
                onclick="unselectAnswerTile('${tile.id}')"
                class="animate-pop px-2.5 py-1.5 rounded-xl bg-white border-2 border-b-4 border-slate-300 hover:border-[#1CB0F6] text-slate-800 font-bold flex flex-col items-center justify-center active:border-b-2 active:translate-y-0.5 transition-all">
          ${state.showPinyin && tile.py ? `<span class="text-[10px] leading-none text-slate-400 font-semibold mb-0.5">${tile.py}</span>` : ''}
          <span class="${isEnToZh ? 'font-zh text-base' : 'text-sm'} leading-tight">${tile.text}</span>
        </button>
      `).join('');

      const bankTilesHtml = lesson.bankTiles.map(tile => {
        if (tile.used) {
          return `
            <div class="px-3 py-1.5 rounded-xl bg-slate-100 border-2 border-slate-200 text-transparent flex flex-col items-center justify-center pointer-events-none">
              ${state.showPinyin && tile.py ? `<span class="text-[10px] leading-none mb-0.5">${tile.py}</span>` : ''}
              <span class="${isEnToZh ? 'font-zh text-base' : 'text-sm'} leading-tight">${tile.text}</span>
            </div>
          `;
        }
        return `
          <button type="button"
                  onclick="selectBankTile('${tile.id}')"
                  class="px-3 py-1.5 rounded-xl bg-white border-2 border-b-4 border-slate-200 hover:border-slate-300 text-slate-700 font-bold flex flex-col items-center justify-center active:border-b-2 active:translate-y-0.5 transition-all shadow-2xs">
            ${state.showPinyin && tile.py ? `<span class="text-[10px] leading-none text-slate-400 font-semibold mb-0.5">${tile.py}</span>` : ''}
            <span class="${isEnToZh ? 'font-zh text-base' : 'text-sm'} leading-tight">${tile.text}</span>
          </button>
        `;
      }).join('');

      let feedbackSheetHtml = '';
      if (lesson.feedback) {
        const ok = lesson.feedback.isCorrect;
        feedbackSheetHtml = `
          <div class="absolute inset-x-0 bottom-0 z-20 px-6 pt-3.5 pb-4 rounded-t-3xl border-t-2 ${
            ok ? 'bg-[#D7FFB8] border-[#b8f28b] text-[#58A700]' : 'bg-[#FFDFE0] border-[#ffc1c3] text-[#EA2B2B]'
          } shadow-2xl animate-pop">
            <div class="flex items-start gap-2.5 mb-3">
              <div class="w-8 h-8 rounded-full ${ok ? 'bg-[#58CC02]' : 'bg-[#FF4B4B]'} text-white font-black flex items-center justify-center shrink-0 mt-0.5">
                ${ok ? '✓' : '✕'}
              </div>
              <div class="min-w-0 flex-1">
                <div class="font-extrabold text-base leading-tight">
                  ${ok ? 'Chính xác!' : 'Đáp án đúng:'}
                </div>
                <div class="font-bold text-sm mt-0.5 ${ok ? 'text-[#468700]' : 'text-[#c92020]'} ${isEnToZh ? 'font-zh text-base' : ''}">
                  ${lesson.feedback.correctDisplay}
                </div>
                ${state.showPinyin && lesson.feedback.correctSub ? `
                  <div class="text-xs font-semibold opacity-85 mt-0.5">${lesson.feedback.correctSub}</div>
                ` : ''}
              </div>
            </div>
            <button type="button"
                    onclick="continueLesson()"
                    class="w-full py-3.5 rounded-2xl font-extrabold text-base uppercase tracking-wide text-white ${
                      ok
                        ? 'bg-[#58CC02] border-b-4 border-[#58A700]'
                        : 'bg-[#FF4B4B] border-b-4 border-[#EA2B2B]'
                    } active:border-b-0 active:translate-y-1 transition-all">
              TIẾP TỤC
            </button>
          </div>
        `;
      }

      const outOfHeartsHtml = lesson.outOfHearts ? `
        <div class="absolute inset-0 z-30 bg-slate-900/55 flex items-center justify-center p-6 animate-pop">
          <div class="bg-white w-full rounded-3xl border-2 border-slate-200 p-5 text-center shadow-2xl">
            <div class="text-4xl mb-2">💔</div>
            <h3 class="font-extrabold text-lg text-slate-800 mb-1">Bạn đã hết tim rồi!</h3>
            <p class="text-xs font-semibold text-slate-500 mb-4">Hồi phục tim để tiếp tục hoàn thành bài học nhé.</p>
            <div class="space-y-2">
              <button type="button"
                      onclick="refillHearts()"
                      class="w-full py-3 rounded-2xl font-extrabold text-sm uppercase tracking-wide text-white bg-[#58CC02] border-b-4 border-[#58A700] active:border-b-0 active:translate-y-1 transition-all">
                Hồi phục tim ❤️
              </button>
              <button type="button"
                      onclick="exitLesson()"
                      class="w-full py-2.5 rounded-2xl font-extrabold text-xs uppercase tracking-wide text-slate-500 hover:bg-slate-100 transition-colors">
                Về trang chủ
              </button>
            </div>
          </div>
        </div>
      ` : '';

      return `
        <!-- Thanh HUD trên cùng -->
        <header class="shrink-0 pt-3.5 pb-2 flex items-center gap-2">
          <button type="button"
                  onclick="exitLesson()"
                  class="w-8 h-8 rounded-xl text-slate-400 hover:bg-slate-100 hover:text-slate-600 font-extrabold text-lg flex items-center justify-center shrink-0">
            ✕
          </button>

          <div class="flex-1 h-3.5 bg-slate-200 rounded-full overflow-hidden p-0.5">
            <div class="h-full bg-[#58CC02] rounded-full transition-all duration-300" style="width: ${Math.max(8, progressPct)}%"></div>
          </div>

          <div class="flex items-center gap-1.5 shrink-0 text-xs font-extrabold">
            <span class="px-1.5 py-1 rounded-lg bg-yellow-50 text-yellow-600">⚡${state.xp + lesson.sessionXp}</span>
            <span class="px-1.5 py-1 rounded-lg bg-rose-50 text-[#FF4B4B]">❤️${lesson.hearts}</span>
          </div>
        </header>

        <!-- Khu vực đề bài dịch hai chiều -->
        <section class="shrink-0 mt-0.5">
          <div class="flex items-center justify-between gap-1.5 mb-1.5">
            <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-xl text-xs font-extrabold ${
              isEnToZh ? 'bg-emerald-50 text-[#58A700]' : 'bg-sky-50 text-[#1899D6]'
            }">
              <span>${isEnToZh ? '🇬🇧 ➔ 🇨🇳' : '🇨🇳 ➔ 🇬🇧'}</span>
              <span>${isEnToZh ? 'Dịch sang tiếng Trung' : 'Dịch sang tiếng Anh'}</span>
            </span>

            <div class="flex items-center gap-1">
              ${q.viHint ? `
                <button type="button"
                        onclick="toggleViHint()"
                        class="px-2 py-0.5 rounded-lg text-[11px] font-bold border ${
                          state.showViHint ? 'border-emerald-300 text-emerald-700 bg-emerald-50' : 'border-slate-200 text-slate-400'
                        }">
                  Nghĩa Việt
                </button>
              ` : ''}
              <button type="button"
                      onclick="togglePinyin()"
                      class="px-2 py-0.5 rounded-lg text-[11px] font-bold border ${
                        state.showPinyin ? 'border-[#1CB0F6] text-[#1899D6] bg-sky-50' : 'border-slate-200 text-slate-400'
                      }">
                Pinyin
              </button>
            </div>
          </div>

          <!-- Thẻ câu gốc kèm phát âm thường 1.0x & chậm 0.65x -->
          <div class="rounded-2xl border-2 border-slate-200 bg-slate-50/70 p-3 flex items-center gap-3">
            <div class="flex flex-col gap-1.5 shrink-0">
              <button type="button"
                      onclick="speakText('${q.promptText.replace(/'/g, "\\'")}', '${q.promptLang}', false)"
                      class="w-10 h-9 rounded-xl bg-[#1CB0F6] border-b-4 border-[#1899D6] text-white text-sm flex items-center justify-center active:border-b-0 active:translate-y-0.5 transition-all">
                🔊
              </button>
              <button type="button"
                      onclick="speakText('${q.promptText.replace(/'/g, "\\'")}', '${q.promptLang}', true)"
                      class="w-10 h-7 rounded-lg bg-white border-2 border-b-3 border-slate-200 text-xs flex items-center justify-center active:translate-y-0.5 transition-all">
                🐢
              </button>
            </div>

            <div class="min-w-0 flex-1">
              <div class="font-extrabold text-slate-800 ${isEnToZh ? 'text-base sm:text-lg' : 'font-zh text-lg sm:text-xl'} leading-snug">
                ${q.promptText}
              </div>
              ${!isEnToZh && state.showPinyin && q.promptSub ? `
                <div class="text-xs font-bold text-[#1899D6] mt-0.5">${q.promptSub}</div>
              ` : ''}
              ${state.showViHint && q.viHint ? `
                <div class="text-[11px] font-semibold text-slate-500 mt-1">🇻🇳 ${q.viHint}</div>
              ` : ''}
            </div>
          </div>
        </section>

        <!-- Khu vực xây dựng đáp án -->
        <section class="shrink-0 mt-2">
          <div class="flex items-center justify-between mb-1">
            <span class="text-[11px] font-extrabold uppercase tracking-wider text-slate-400">
              ${lesson.inputMode === 'bank' ? 'Chạm thẻ từ để ghép câu' : 'Nhập câu trả lời'}
            </span>
            <button type="button"
                    onclick="toggleInputMode()"
                    class="px-2.5 py-1 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-600 text-[11px] font-extrabold transition-colors">
              ${lesson.inputMode === 'bank' ? '⌨️ Gõ phím' : '🧩 Ghép từ'}
            </button>
          </div>

          ${lesson.inputMode === 'bank' ? `
            <div class="min-h-[78px] max-h-[106px] overflow-y-auto thin-scroll rounded-2xl border-2 border-dashed border-slate-300 bg-slate-50/40 p-2 flex flex-wrap content-start gap-1.5">
              ${lesson.selectedTiles.length > 0
                ? selectedTilesHtml
                : `<span class="text-xs font-semibold text-slate-400 m-auto">Chọn các từ bên dưới...</span>`
              }
            </div>
          ` : `
            <textarea id="answer-input"
                      rows="3"
                      oninput="updateTypedAnswer(this.value)"
                      onkeydown="if(event.key==='Enter' && !event.shiftKey){ event.preventDefault(); checkAnswer(); }"
                      placeholder="${isEnToZh ? 'Nhập câu tiếng Trung...' : 'Nhập câu tiếng Anh...'}"
                      class="w-full h-[84px] rounded-2xl border-2 border-slate-300 focus:border-[#1CB0F6] bg-white p-3 font-bold text-slate-800 ${isEnToZh ? 'font-zh text-base' : 'text-sm'} resize-none outline-none transition-colors">${lesson.typedAnswer}</textarea>
          `}
        </section>

        <!-- Kho thẻ từ (Word Bank) -->
        <section class="flex-1 min-h-0 flex flex-col justify-center py-1.5 overflow-hidden">
          ${lesson.inputMode === 'bank' ? `
            <div class="flex flex-wrap justify-center items-center content-center gap-1.5">
              ${bankTilesHtml}
            </div>
          ` : `
            <div class="text-center px-2">
              <div class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-sky-50 text-[#1899D6] text-xs font-bold">
                <span>💡</span>
                <span>Nhấn Enter hoặc nút Kiểm tra bên dưới</span>
              </div>
            </div>
          `}
        </section>

        <!-- Nút Kiểm tra cố định dưới đáy -->
        <footer class="shrink-0 pb-4 pt-1">
          <button id="check-btn"
                  type="button"
                  onclick="checkAnswer()"
                  ${!hasAnswer ? 'disabled' : ''}
                  class="w-full py-3.5 rounded-2xl font-extrabold text-base tracking-wide uppercase transition-all ${
                    hasAnswer
                      ? 'text-white bg-[#58CC02] border-b-4 border-[#58A700] active:border-b-0 active:translate-y-1 shadow-sm'
                      : 'text-slate-400 bg-slate-200 border-b-4 border-slate-300 cursor-not-allowed'
                  }">
            KIỂM TRA
          </button>
        </footer>

        ${feedbackSheetHtml}
        ${outOfHeartsHtml}
      `;
    }

    function renderComplete() {
      const lesson = state.lesson;
      const accuracy = Math.round((lesson.correctCount / lesson.questions.length) * 100);

      return `
        <div class="h-full flex flex-col justify-between py-6 animate-pop">
          <div class="flex-1 flex flex-col items-center justify-center text-center">
            <div class="w-24 h-24 rounded-3xl bg-amber-100 border-b-4 border-amber-300 flex items-center justify-center text-5xl mb-4 shadow-sm">
              🏆
            </div>

            <h2 class="font-display font-black text-2xl text-[#FFC800] mb-1">
              Hoàn thành bài học!
            </h2>
            <p class="text-xs font-bold text-slate-500 mb-6">
              ${lesson.topicTitle} · Trình độ ${state.cefr}
            </p>

            <div class="grid grid-cols-3 gap-2.5 w-full">
              <div class="rounded-2xl border-2 border-[#FFC800] bg-amber-50 p-3 flex flex-col items-center">
                <span class="text-[10px] font-extrabold uppercase text-amber-600 mb-1">Kinh nghiệm</span>
                <span class="font-display font-black text-lg text-amber-600">⚡ +${lesson.sessionXp}</span>
              </div>

              <div class="rounded-2xl border-2 border-[#58CC02] bg-emerald-50 p-3 flex flex-col items-center">
                <span class="text-[10px] font-extrabold uppercase text-[#58A700] mb-1">Chính xác</span>
                <span class="font-display font-black text-lg text-[#58A700]">🎯 ${accuracy}%</span>
              </div>

              <div class="rounded-2xl border-2 border-[#1CB0F6] bg-sky-50 p-3 flex flex-col items-center">
                <span class="text-[10px] font-extrabold uppercase text-[#1899D6] mb-1">Tổng XP</span>
                <span class="font-display font-black text-lg text-[#1899D6]">⭐ ${state.xp}</span>
              </div>
            </div>
          </div>

          <button type="button"
                  onclick="exitLesson()"
                  class="w-full py-3.5 rounded-2xl font-extrabold text-base uppercase tracking-wide text-white bg-[#58CC02] border-b-4 border-[#58A700] active:border-b-0 active:translate-y-1 transition-all">
            TIẾP TỤC
          </button>
        </div>
      `;
    }

    function render() {
      const app = document.getElementById('app');
      if (!app) return;
      if (state.screen === 'home') {
        app.innerHTML = renderHome();
      } else if (state.screen === 'lesson') {
        app.innerHTML = renderLesson();
      } else if (state.screen === 'complete') {
        app.innerHTML = renderComplete();
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      render();
    });
  </script>
</body>
</html>
```
