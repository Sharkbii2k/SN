        osc.type = type;
        osc.frequency.setValueAtTime(freq, now);
        gain.gain.setValueAtTime(gainVal, now);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + duration);
      },
      tap() {
        this.playTone(540, 'sine', 0.06, 0, 0.05);
      },
      correct() {
        this.playTone(523.25, 'triangle', 0.14, 0, 0.09);
        this.playTone(659.25, 'triangle', 0.14, 0.08, 0.09);
        this.playTone(783.99, 'triangle', 0.22, 0.16, 0.1);
      },
      wrong() {
        this.playTone(240, 'sawtooth', 0.16, 0, 0.06);
        this.playTone(190, 'sawtooth', 0.24, 0.12, 0.06);
      },
      complete() {
        this.playTone(523.25, 'triangle', 0.14, 0, 0.09);
        this.playTone(659.25, 'triangle', 0.14, 0.09, 0.09);
        this.playTone(783.99, 'triangle', 0.14, 0.18, 0.09);
        this.playTone(1046.5, 'triangle', 0.34, 0.27, 0.11);
      }
    };

    function speakText(text, lang = 'zh-CN', slow = false) {
      if (!state.soundEnabled || !('speechSynthesis' in window)) return;
      try {
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(text);
        utter.lang = lang;
        utter.rate = slow ? 0.65 : 1.0;
        const voices = window.speechSynthesis.getVoices();
        const prefix = lang.slice(0, 2).toLowerCase();
        const match = voices.find(v => v.lang && v.lang.toLowerCase().startsWith(prefix));
        if (match) utter.voice = match;
        window.speechSynthesis.speak(utter);
      } catch (e) {}
    }

    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
    }

    /* =========================================================================
       4. CURRICULUM STATE & PERSISTENCE
       ========================================================================= */
    function buildInitialCurriculum() {
      const data = {};
      for (const lvl of CEFR_LEVELS) {
        data[lvl] = BLUEPRINT_TOPICS[lvl].map(bp => {
          const seed = SEED_CONTENT[bp.id];
          return {
            id: bp.id,
            cefr: lvl,
            en: bp.en,
            zh: bp.zh,
            vocab: seed ? JSON.parse(JSON.stringify(seed.vocab)) : [],
            sentences: seed ? JSON.parse(JSON.stringify(seed.sentences)) : []
          };
        });
      }
      return data;
    }

    const state = {
      screen: 'home', // 'home' | 'lesson' | 'complete'
      cefr: 'A1',
      showPinyin: true,
      soundEnabled: true,
      xp: 0,
      curriculum: buildInitialCurriculum(),
      stageProgress: {}, // { 'a1_t1_s0': true, ... }
      toast: null, // { text, type: 'success' | 'error' | 'info' }

      // Vocab Modal
      vocabModal: {
        open: false,
        topicId: null
      },

      // Prompt Generator & JSON Importer Modal
      importer: {
        open: false,
        targetCefr: 'A1',
        targetTopicId: 'a1_t3',
        rawJson: '',
        statusMsg: null, // { type: 'success' | 'error', text }
        copiedPrompt: false,
        confirmReset: false
      },

      // Active Practice Session (5 questions per stage, mandatory mistake retry)
      lesson: {
        topicId: null,
        topicEn: '',
        topicZh: '',
        stageIndex: 0,
        queue: [],
        initialTotal: 5,
        solvedCount: 0,
        firstTryCount: 0,
        recoveredMistakesCount: 0,
        sessionXp: 0,
        inputMode: 'bank', // 'bank' | 'type'
        selectedTiles: [],
        bankTiles: [],
        typedAnswer: '',
        feedback: null // { isCorrect, isRetry, expectedText, expectedSub, answerLang }
      }
    };

    let toastTimer = null;
    function showToast(text, type = 'info') {
      state.toast = { text, type };
      render();
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        state.toast = null;
        render();
      }, 2600);
    }

    function saveState() {
      try {
        const customTopics = {};
        for (const lvl of CEFR_LEVELS) {
          for (const t of state.curriculum[lvl]) {
            if (t.sentences.length > 0 || t.vocab.length > 0) {
              customTopics[t.id] = {
                vocab: t.vocab,
                sentences: t.sentences
              };
            }
          }
        }
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
          cefr: state.cefr,
          showPinyin: state.showPinyin,
          soundEnabled: state.soundEnabled,
          xp: state.xp,
          stageProgress: state.stageProgress,
          customTopics
        }));
      } catch (e) {}
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return;
        const saved = JSON.parse(raw);
        if (saved.cefr && CEFR_LEVELS.includes(saved.cefr)) state.cefr = saved.cefr;
        if (typeof saved.showPinyin === 'boolean') state.showPinyin = saved.showPinyin;
        if (typeof saved.soundEnabled === 'boolean') state.soundEnabled = saved.soundEnabled;
        if (typeof saved.xp === 'number') state.xp = saved.xp;
        if (saved.stageProgress && typeof saved.stageProgress === 'object') {
          state.stageProgress = saved.stageProgress;
        }
        if (saved.customTopics && typeof saved.customTopics === 'object') {
          for (const lvl of CEFR_LEVELS) {
            for (const t of state.curriculum[lvl]) {
              const savedT = saved.customTopics[t.id];
              if (savedT) {
                if (Array.isArray(savedT.vocab)) t.vocab = savedT.vocab;
                if (Array.isArray(savedT.sentences)) t.sentences = savedT.sentences;
              }
            }
          }
        }
      } catch (e) {}
    }

    /* =========================================================================
       5. HELPERS: SYLLABUS METRICS, TOKENIZATION & NORMALIZATION
       ========================================================================= */
    function getLevelStats(lvl) {
      const topics = state.curriculum[lvl] || [];
      let completedTopics = 0;
      let totalSentences = 0;
      for (const t of topics) {
        const count = Math.min(TARGET_SENTENCES_PER_TOPIC, t.sentences.length);
        totalSentences += count;
        if (count >= TARGET_SENTENCES_PER_TOPIC) completedTopics += 1;
      }
      return {
        completedTopics,
        totalTopics: topics.length,
        totalSentences,
        targetSentences: topics.length * TARGET_SENTENCES_PER_TOPIC,
        isLevelComplete: completedTopics === topics.length
      };
    }

    function findTopicById(topicId) {
      for (const lvl of CEFR_LEVELS) {
        const found = (state.curriculum[lvl] || []).find(t => t.id === topicId);
        if (found) return found;
      }
      return null;
    }

    function findNextMissingTarget(startCefr = state.cefr) {
      const startIdx = Math.max(0, CEFR_LEVELS.indexOf(startCefr));
      const orderedLevels = [
        ...CEFR_LEVELS.slice(startIdx),
        ...CEFR_LEVELS.slice(0, startIdx)
      ];
      for (const lvl of orderedLevels) {
        const topics = state.curriculum[lvl] || [];
        const incomplete = topics.find(t => t.sentences.length < TARGET_SENTENCES_PER_TOPIC);
        if (incomplete) {
          return { cefr: lvl, topicId: incomplete.id, allComplete: false };
        }
      }
      return { cefr: 'C2', topicId: 'c2_t8', allComplete: true };
    }

    function shuffleArray(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function normalizeChinese(str) {
      return (str || '')
        .replace(/[\s，。！？、；：“”‘’（）《》【】·,.!?;:'"()\-—…]/g, '')
        .trim();
    }

    function normalizeEnglish(str) {
      let s = (str || '')
        .toLowerCase()
        .replace(/[’‘]/g, "'")
        .replace(/[.,!?;:"()\-—…]/g, ' ')
        .replace(/\s+/g, ' ')
        .trim();

      const contractions = [
        [/\bi'm\b/g, 'i am'],
        [/\byou're\b/g, 'you are'],
        [/\bwe're\b/g, 'we are'],
        [/\bthey're\b/g, 'they are'],
        [/\bhe's\b/g, 'he is'],
        [/\bshe's\b/g, 'she is'],
        [/\bit's\b/g, 'it is'],
        [/\bthat's\b/g, 'that is'],
        [/\bwhat's\b/g, 'what is'],
        [/\bwhere's\b/g, 'where is'],
        [/\bwho's\b/g, 'who is'],
        [/\bhow's\b/g, 'how is'],
        [/\bthere's\b/g, 'there is'],
        [/\bdon't\b/g, 'do not'],
        [/\bdoesn't\b/g, 'does not'],
        [/\bdidn't\b/g, 'did not'],
        [/\bcan't\b/g, 'cannot'],
        [/\bwon't\b/g, 'will not'],
        [/\bisn't\b/g, 'is not'],
        [/\baren't\b/g, 'are not'],
        [/\bwasn't\b/g, 'was not'],
        [/\bweren't\b/g, 'were not'],
        [/\bhaven't\b/g, 'have not'],
        [/\bhasn't\b/g, 'has not'],
        [/\blet's\b/g, 'let us']
      ];
      for (const [pattern, replacement] of contractions) {
        s = s.replace(pattern, replacement);
      }
      return s.replace(/\s+/g, ' ').trim();
    }

    function autoSplitEnglish(en) {
      return (en || '')
        .replace(/[.,!?;:"()]/g, '')
        .split(/\s+/)
        .map(w => w.trim())
        .filter(Boolean);
    }

    function autoSplitChinese(zh) {
      const clean = normalizeChinese(zh);
      if (!clean) return [];
      const chunks = [];
      let i = 0;
      while (i < clean.length) {
        const take = (clean.length - i >= 2 && i % 2 === 0) ? 2 : 1;
        chunks.push(clean.slice(i, i + take));
        i += take;
      }
      return chunks;
    }

    function copyTextSafe(text) {
      try {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.setAttribute('readonly', '');
        ta.style.position = 'fixed';
        ta.style.top = '-9999px';
        ta.style.left = '-9999px';
        document.body.appendChild(ta);
        ta.select();
        ta.setSelectionRange(0, text.length);
        const ok = document.execCommand('copy');
        document.body.removeChild(ta);
        return ok;
      } catch (e) {
        return false;
      }
    }

    /* =========================================================================
       6. STRICT MASTERY PRACTICE ENGINE (MANDATORY MISTAKE RETRY)
       ========================================================================= */
    function buildStageQuestions(cefr, topic, stageIndex) {
      const start = stageIndex * QUESTIONS_PER_STAGE;
      const slice = topic.sentences.slice(start, start + QUESTIONS_PER_STAGE);

      // Build distractor pools from the same CEFR level or A1 fallback
      const levelTopics = state.curriculum[cefr] || [];
      const fallbackTopics = state.curriculum.A1 || [];
      const poolTopics = levelTopics.some(t => t.sentences.length > 0) ? levelTopics : fallbackTopics;

      const zhPool = [];
      const enPool = [];
      for (const t of poolTopics) {
        for (const s of t.sentences) {
          for (const zt of (s.zhTokens || [])) {
            if (zt && !zhPool.includes(zt)) zhPool.push(zt);
          }
          for (const et of (s.enTokens || [])) {
            if (et && !enPool.includes(et)) enPool.push(et);
          }
        }
      }

      return slice.map((item, idx) => {
        // Alternate EN -> ZH and ZH -> EN cleanly
        const direction = ((stageIndex + idx) % 2 === 0) ? 'EN_TO_ZH' : 'ZH_TO_EN';
        const zhTokens = (item.zhTokens && item.zhTokens.length > 0)
          ? item.zhTokens
          : autoSplitChinese(item.zh);
        const enTokens = (item.enTokens && item.enTokens.length > 0)
          ? item.enTokens
          : autoSplitEnglish(item.en);

        if (direction === 'EN_TO_ZH') {
          const correctTiles = zhTokens.map((text, i) => ({
            id: `c_${idx}_${i}_${Math.random().toString(36).slice(2, 6)}`,
            text,
            used: false
          }));
          const usedSet = new Set(zhTokens);
          const distractors = [];
          for (const cand of shuffleArray(zhPool)) {
            if (!usedSet.has(cand) && distractors.length < 3) {
              usedSet.add(cand);
              distractors.push({
                id: `d_${idx}_${distractors.length}_${Math.random().toString(36).slice(2, 6)}`,
                text: cand,
                used: false
              });
            }
          }
          return {
            direction,
            isRetry: false,
            promptText: item.en,
            promptSub: '',
            promptLang: 'en-US',
            answerLang: 'zh-CN',
            expectedText: item.zh,
            expectedSub: item.py || '',
            bank: shuffleArray([...correctTiles, ...distractors])
          };
        } else {
          const correctTiles = enTokens.map((text, i) => ({
            id: `c_${idx}_${i}_${Math.random().toString(36).slice(2, 6)}`,
            text,
            used: false
          }));
          const usedSet = new Set(enTokens.map(w => w.toLowerCase()));
          const distractors = [];
          for (const cand of shuffleArray(enPool)) {
            if (!usedSet.has(cand.toLowerCase()) && distractors.length < 3) {
              usedSet.add(cand.toLowerCase());
              distractors.push({
                id: `d_${idx}_${distractors.length}_${Math.random().toString(36).slice(2, 6)}`,
                text: cand,
                used: false
              });
            }
          }
          return {
            direction,
            isRetry: false,
            promptText: item.zh,
            promptSub: item.py || '',
            promptLang: 'zh-CN',
            answerLang: 'en-US',
            expectedText: item.en,
            expectedSub: '',
            bank: shuffleArray([...correctTiles, ...distractors])
          };
        }
      });
    }

    function startStage(topicId, stageIndex) {
      const topic = findTopicById(topicId);
      if (!topic) return;
      const start = stageIndex * QUESTIONS_PER_STAGE;
      if (topic.sentences.length <= start) return;

      SFX.tap();
      state.vocabModal.open = false;
      state.importer.open = false;

      const questions = buildStageQuestions(topic.cefr, topic, stageIndex);
      state.screen = 'lesson';
      state.lesson = {
        topicId: topic.id,
        topicEn: topic.en,
        topicZh: topic.zh,
        stageIndex,
        queue: questions,
        initialTotal: questions.length,
        solvedCount: 0,
        firstTryCount: 0,
        recoveredMistakesCount: 0,
        sessionXp: 0,
        inputMode: 'bank',
        selectedTiles: [],
        bankTiles: questions[0].bank.map(t => ({ ...t, used: false })),
        typedAnswer: '',
        feedback: null
      };
      render();
      setTimeout(() => {
        const q = state.lesson.queue[0];
        if (q) speakText(q.promptText, q.promptLang, false);
      }, 220);
    }

    function exitLesson() {
      SFX.tap();
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      state.screen = 'home';
      render();
    }

    function selectBankTile(tileId) {
      const lesson = state.lesson;
      if (lesson.feedback) return;
      const tile = lesson.bankTiles.find(t => t.id === tileId);
      if (!tile || tile.used) return;
      SFX.tap();
      tile.used = true;
      lesson.selectedTiles.push({ id: tile.id, text: tile.text });
      render();
    }

    function removeSelectedTile(tileId) {
      const lesson = state.lesson;
      if (lesson.feedback) return;
      const idx = lesson.selectedTiles.findIndex(t => t.id === tileId);
      if (idx === -1) return;
      SFX.tap();
      lesson.selectedTiles.splice(idx, 1);
      const bankTile = lesson.bankTiles.find(t => t.id === tileId);
      if (bankTile) bankTile.used = false;
      render();
    }

    function clearSelectedTiles() {
      const lesson = state.lesson;
      if (lesson.feedback || lesson.selectedTiles.length === 0) return;
      SFX.tap();
      lesson.selectedTiles = [];
      lesson.bankTiles.forEach(t => { t.used = false; });
      render();
    }

    function toggleInputMode() {
      const lesson = state.lesson;
      if (lesson.feedback) return;
      SFX.tap();
      lesson.inputMode = lesson.inputMode === 'bank' ? 'type' : 'bank';
      render();
      if (lesson.inputMode === 'type') {
        setTimeout(() => {
          const inp = document.getElementById('typed-answer-input');
          if (inp) inp.focus();
        }, 40);
      }
    }

    function updateTypedAnswer(val) {
      state.lesson.typedAnswer = val;
      const btn = document.getElementById('check-answer-btn');
      if (btn) {
        const hasVal = val.trim().length > 0;
        btn.disabled = !hasVal;
        btn.className = hasVal
          ? 'w-full py-3.5 rounded-2xl font-extrabold text-sm uppercase tracking-wider text-white bg-[#58CC02] border-b-4 border-[#58A700] active:border-b-0 active:translate-y-1 transition-all'
          : 'w-full py-3.5 rounded-2xl font-extrabold text-sm uppercase tracking-wider text-slate-400 bg-slate-200 border-b-4 border-slate-300 cursor-not-allowed';
      }
    }

    function submitAnswer() {
      const lesson = state.lesson;
      if (lesson.feedback) return;
      const q = lesson.queue[0];
      if (!q) return;

      const userRaw = lesson.inputMode === 'bank'
        ? (q.direction === 'EN_TO_ZH'
            ? lesson.selectedTiles.map(t => t.text).join('')
            : lesson.selectedTiles.map(t => t.text).join(' '))
        : lesson.typedAnswer.trim();

      if (!userRaw) return;

      const isCorrect = q.direction === 'EN_TO_ZH'
        ? normalizeChinese(userRaw) === normalizeChinese(q.expectedText)
        : normalizeEnglish(userRaw) === normalizeEnglish(q.expectedText);

      if (isCorrect) {
        SFX.correct();
        lesson.solvedCount += 1;
        if (!q.isRetry) {
          lesson.firstTryCount += 1;
          lesson.sessionXp += 15;
        } else {
          lesson.recoveredMistakesCount += 1;
          lesson.sessionXp += 10;
        }
        speakText(q.expectedText, q.answerLang, false);
        lesson.feedback = {
          isCorrect: true,
          isRetry: !!q.isRetry,
          expectedText: q.expectedText,
          expectedSub: q.expectedSub,
          answerLang: q.answerLang
        };
      } else {
        SFX.wrong();
        // MANDATORY RETRY RULE: Re-queue missed question to the end of the stage queue
        lesson.queue.push({
          ...q,
          isRetry: true,
          bank: q.bank.map(t => ({ ...t, used: false }))
        });
        setTimeout(() => speakText(q.expectedText, q.answerLang, false), 340);
        lesson.feedback = {
          isCorrect: false,
          isRetry: !!q.isRetry,
          expectedText: q.expectedText,
          expectedSub: q.expectedSub,
          answerLang: q.answerLang
        };
      }
      render();
    }

    function continueLesson() {
      const lesson = state.lesson;
      if (!lesson.feedback) return;
      SFX.tap();

      // Remove current question from front of queue (if wrong, its retry clone is already at the back)
      lesson.queue.shift();

      if (lesson.queue.length > 0) {
        const nextQ = lesson.queue[0];
        lesson.selectedTiles = [];
        lesson.bankTiles = nextQ.bank.map(t => ({ ...t, used: false }));
        lesson.typedAnswer = '';
        lesson.feedback = null;
        render();
        setTimeout(() => speakText(nextQ.promptText, nextQ.promptLang, false), 200);
      } else {
        // Stage 100% mastered!
        SFX.complete();
        const totalXp = lesson.sessionXp + 10;
        lesson.sessionXp = totalXp;
        state.xp += totalXp;

        const stageKey = `${lesson.topicId}_s${lesson.stageIndex}`;
        state.stageProgress[stageKey] = true;
        saveState();

        state.screen = 'complete';
        render();
      }
    }

    /* =========================================================================
       7. PROMPT GENERATOR & JSON IMPORTER (AUTO-ADVANCING SYLLABUS FILLER)
       ========================================================================= */
    function openImporter(preferredCefr = state.cefr, specificTopicId = null) {
      SFX.tap();
      let targetCefr = preferredCefr;
      let targetTopicId = specificTopicId;

      if (specificTopicId) {
        const t = findTopicById(specificTopicId);
        if (t) targetCefr = t.cefr;
      } else {
        const next = findNextMissingTarget(preferredCefr);
        targetCefr = next.cefr;
        targetTopicId = next.topicId;
      }

      state.importer = {
        open: true,
        targetCefr,
        targetTopicId,
        rawJson: '',
        statusMsg: null,
        copiedPrompt: false,
        confirmReset: false
      };
      render();
    }

    function closeImporter() {
      SFX.tap();
      state.importer.open = false;
      render();
    }

    function setImporterCefr(newCefr) {
      SFX.tap();
      const topics = state.curriculum[newCefr] || [];
      const firstIncomplete = topics.find(t => t.sentences.length < TARGET_SENTENCES_PER_TOPIC);
      state.importer.targetCefr = newCefr;
      state.importer.targetTopicId = firstIncomplete ? firstIncomplete.id : topics[0].id;
      state.importer.statusMsg = null;
      state.importer.copiedPrompt = false;
      render();
    }

    function setImporterTopic(newTopicId) {
      SFX.tap();
      state.importer.targetTopicId = newTopicId;
      state.importer.statusMsg = null;
      state.importer.copiedPrompt = false;
      render();
    }

    function generateSyllabusPrompt() {
      const imp = state.importer;
      const topic = findTopicById(imp.targetTopicId);
      if (!topic) return '';

      const existingSentences = topic.sentences || [];
      const existingVocab = topic.vocab || [];
      const neededSentences = Math.max(1, TARGET_SENTENCES_PER_TOPIC - existingSentences.length);
      const neededVocab = Math.max(0, TARGET_VOCAB_PER_TOPIC - existingVocab.length);

      const existingListBlock = existingSentences.length > 0
        ? `\nEXISTING SENTENCES IN THIS TOPIC (DO NOT DUPLICATE):\n${existingSentences.map((s, idx) => `${idx + 1}. ${s.en} | ${s.zh}`).join('\n')}\n`
        : '';

      return `Generate authentic bilingual English + Simplified Chinese learning content for a CEFR ${topic.cefr} syllabus module.

TARGET MODULE:
- CEFR Level: ${topic.cefr} (${LEVEL_DESCRIPTIONS[topic.cefr]})
- Topic ID: "${topic.id}"
- Topic Title: "${topic.en}" (${topic.zh})
- Required New Sentences: ${neededSentences}
- Required Vocabulary Items: ${neededVocab > 0 ? neededVocab : 8}

STRICT RULES:
1. Output ONLY valid JSON (no markdown commentary, no extra prose).
2. Use ONLY natural English and Simplified Chinese (+ accurate Pinyin with tone marks). Do NOT include any other language.
3. Every sentence must fit CEFR ${topic.cefr} complexity and strictly match the topic "${topic.en}".
4. "zhTokens" must split the Chinese sentence into natural word/phrase tiles (excluding punctuation) that concatenate back to the exact Chinese sentence.
5. "enTokens" must split the English sentence into natural word tiles (excluding punctuation) that join with spaces back to the exact English sentence.${existingListBlock}
REQUIRED JSON FORMAT:
{
  "cefr": "${topic.cefr}",
  "topicId": "${topic.id}",
  "vocab": [
    { "en": "English term", "zh": "中文词", "py": "pīnyīn" }
  ],
  "sentences": [
    {
      "en": "Natural English sentence.",
      "zh": "自然地道的中文句子。",
      "py": "Zìrán dìdao de Zhōngwén jùzi.",
      "zhTokens": ["自然", "地道", "的", "中文", "句子"],
      "enTokens": ["Natural", "English", "sentence"]
    }
  ]
}`;
    }

    function handleCopyPrompt() {
      const promptText = generateSyllabusPrompt();
      const ok = copyTextSafe(promptText);
      if (ok) {
        SFX.tap();
        state.importer.copiedPrompt = true;
        render();
        setTimeout(() => {
          state.importer.copiedPrompt = false;
          render();
        }, 2200);
      }
    }

    function extractJsonObject(raw) {
      let cleaned = (raw || '').trim();
      cleaned = cleaned.replace(/^```(?:json)?\s*/i, '').replace(/\s*```$/i, '').trim();
      const firstBrace = cleaned.indexOf('{');
      const lastBrace = cleaned.lastIndexOf('}');
      if (firstBrace !== -1 && lastBrace !== -1 && lastBrace > firstBrace) {
        cleaned = cleaned.slice(firstBrace, lastBrace + 1);
      }
      return JSON.parse(cleaned);
    }

    function importSyllabusJson() {
      const imp = state.importer;
      const raw = (imp.rawJson || '').trim();
      if (!raw) {
        SFX.wrong();
        imp.statusMsg = { type: 'error', text: 'Paste the JSON response from Gemini first.' };
        render();
        return;
      }

      try {
        const parsed = extractJsonObject(raw);
        // Resolve target topic (prefer JSON's topicId if valid, else currently selected topic)
        let topic = parsed.topicId ? findTopicById(parsed.topicId) : null;
        if (!topic) topic = findTopicById(imp.targetTopicId);
        if (!topic) {
          throw new Error('Could not match target topic.');
        }

        const incomingSentences = Array.isArray(parsed.sentences) ? parsed.sentences : [];
        const incomingVocab = Array.isArray(parsed.vocab) ? parsed.vocab : [];

        if (incomingSentences.length === 0 && incomingVocab.length === 0) {
          throw new Error('JSON must contain "sentences" or "vocab" arrays.');
        }

        // Merge vocabulary (deduplicated by Chinese/English, up to 8 items)
        const existingVocabZh = new Set(topic.vocab.map(v => normalizeChinese(v.zh)));
        let addedVocabCount = 0;
        for (const v of incomingVocab) {
          if (topic.vocab.length >= TARGET_VOCAB_PER_TOPIC) break;
          if (!v || !v.en || !v.zh) continue;
          const normZh = normalizeChinese(v.zh);
          if (!existingVocabZh.has(normZh)) {
            existingVocabZh.add(normZh);
            topic.vocab.push({
              en: String(v.en).trim(),
              zh: String(v.zh).trim(),
              py: String(v.py || '').trim()
            });
            addedVocabCount += 1;
          }
        }

        // Merge sentences (deduplicated, up to 20 sentences)
        const existingSentZh = new Set(topic.sentences.map(s => normalizeChinese(s.zh)));
        let addedSentCount = 0;
        for (const s of incomingSentences) {
          if (topic.sentences.length >= TARGET_SENTENCES_PER_TOPIC) break;
          if (!s || !s.en || !s.zh) continue;
          const enClean = String(s.en).trim();
          const zhClean = String(s.zh).trim();
          const normZh = normalizeChinese(zhClean);
          if (!existingSentZh.has(normZh)) {
            existingSentZh.add(normZh);
            const zhTokens = (Array.isArray(s.zhTokens) && s.zhTokens.length > 0)
              ? s.zhTokens.map(x => String(x).trim()).filter(Boolean)
              : autoSplitChinese(zhClean);
            const enTokens = (Array.isArray(s.enTokens) && s.enTokens.length > 0)
              ? s.enTokens.map(x => String(x).trim()).filter(Boolean)
              : autoSplitEnglish(enClean);

            topic.sentences.push({
              en: enClean,
              zh: zhClean,
              py: String(s.py || '').trim(),
              zhTokens,
              enTokens
            });
            addedSentCount += 1;
          }
        }

        saveState();
        SFX.complete();

        const isTopicFull = topic.sentences.length >= TARGET_SENTENCES_PER_TOPIC;
        // Auto-advance to the next incomplete topic across A1 -> A2 -> B1 -> B2 -> C1 -> C2
        const nextTarget = findNextMissingTarget(topic.cefr);
        state.cefr = nextTarget.cefr;
        imp.targetCefr = nextTarget.cefr;
        imp.targetTopicId = nextTarget.topicId;
        imp.rawJson = '';
        imp.copiedPrompt = false;

        const nextTopicObj = findTopicById(nextTarget.topicId);
        const advanceNote = nextTarget.allComplete
          ? 'All 48 CEFR topics (A1–C2) are 100% filled!'
          : `Auto-advanced to ${nextTarget.cefr}: ${nextTopicObj ? nextTopicObj.en : ''}.`;

        imp.statusMsg = {
          type: 'success',
          text: `Added +${addedSentCount} sentences & +${addedVocabCount} vocab (${topic.sentences.length}/20${isTopicFull ? ' ✓' : ''}). ${advanceNote}`
        };
        render();
      } catch (err) {
        SFX.wrong();
        imp.statusMsg = {
          type: 'error',
          text: `Invalid JSON format: ${err.message}`
        };
        render();
      }
    }

    function exportBackupJson() {
      const payload = localStorage.getItem(STORAGE_KEY) || JSON.stringify({
        cefr: state.cefr,
        xp: state.xp,

        render();
      }

                ${isEnToZh ? 'Type in Simplified Chinese:' : 'Type in English:'}
              </label>
              <input id="typed-answer-input"
                     type="text"
                     value="${lesson.typedAnswer.replace(/"/g, '&quot;')}"
                     oninput="updateTypedAnswer(this.value)"
                     onkeydown="if(event.key==='Enter'){ event.preventDefault(); submitAnswer(); }"
                     placeholder="${isEnToZh ? 'Enter Chinese characters...' : 'Enter English translation...'}"
                     class="w-full rounded-2xl border-2 border-slate-300 focus:border-[#1CB0F6] focus:outline-none p-3.5 font-bold text-base bg-slate-50 ${isEnToZh ? 'font-zh text-lg' : ''}" />
            </div>
          `}

          <!-- Bottom Controls: Mode Switch + Check Button -->
          <div class="shrink-0 pt-2 space-y-2">
            <div class="flex items-center justify-between gap-2">
              <button type="button"
                      onclick="toggleInputMode()"
                      class="px-3 py-1.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-600 font-extrabold text-xs transition-all">
                ${lesson.inputMode === 'bank' ? '⌨️ Switch to Type' : '🧩 Switch to Tiles'}
              </button>

              ${lesson.inputMode === 'bank' && lesson.selectedTiles.length > 0 ? `
                <button type="button"
                        onclick="clearSelectedTiles()"
                        class="px-3 py-1.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-500 font-extrabold text-xs">
                  Clear
                </button>
              ` : ''}
            </div>

            <button id="check-answer-btn"
                    type="button"
                    ${!hasAnswer ? 'disabled' : ''}
                    onclick="submitAnswer()"
                    class="w-full py-3.5 rounded-2xl font-extrabold text-sm uppercase tracking-wider transition-all ${
                      hasAnswer
                        ? 'text-white bg-[#58CC02] border-b-4 border-[#58A700] active:border-b-0 active:translate-y-1'
                        : 'text-slate-400 bg-slate-200 border-b-4 border-slate-300 cursor-not-allowed'
                    }">
              CHECK ANSWER
            </button>
          </div>
        </section>

        ${feedbackDrawerHtml}
      `;
    }

    function renderComplete() {
      const lesson = state.lesson;
      const topic = findTopicById(lesson.topicId);
      const hasNextStage = topic && (lesson.stageIndex + 1) * QUESTIONS_PER_STAGE < topic.sentences.length;
      const isFlawless = lesson.recoveredMistakesCount === 0 && lesson.firstTryCount === lesson.initialTotal;

      return `
        <div class="h-full flex flex-col justify-between py-5 animate-pop">
          <div class="flex-1 flex flex-col items-center justify-center text-center">
            <div class="w-20 h-20 rounded-3xl bg-amber-100 border-b-4 border-amber-300 flex items-center justify-center text-4xl mb-3 shadow-xs">
              🏆
            </div>

            <div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-emerald-50 border border-emerald-200 text-[#58A700] text-xs font-extrabold mb-2">
              <span>✓</span>
              <span>100% Stage Mastered!</span>
            </div>

            <h2 class="font-display font-black text-2xl text-[#FF9600] mb-0.5">
              Stage ${lesson.stageIndex + 1} Complete!
            </h2>
            <p class="text-xs font-bold text-slate-500 mb-5">
              ${lesson.topicEn} · ${lesson.topicZh} · ⚡ +${lesson.sessionXp} XP
            </p>

            <div class="w-full space-y-2.5 text-left">
              <div class="rounded-2xl border-2 border-[#1CB0F6] bg-sky-50/70 p-3.5 flex items-center justify-between gap-2">
                <div class="flex items-center gap-2.5">
                  <span class="w-9 h-9 rounded-xl bg-white border border-sky-200 flex items-center justify-center text-lg">🎯</span>
                  <div>
                    <div class="text-[11px] font-extrabold uppercase text-[#1899D6]">First-Try Score</div>
                    <div class="text-xs font-semibold text-slate-500">Solved on initial attempt</div>
                  </div>
                </div>
                <span class="font-display font-black text-lg text-[#1899D6]">
                  ${lesson.firstTryCount}/${lesson.initialTotal} on 1st try
                </span>
              </div>

              <div class="rounded-2xl border-2 ${isFlawless ? 'border-[#58CC02] bg-emerald-50/70' : 'border-[#FF9600] bg-amber-50/70'} p-3.5 flex items-center justify-between gap-2">
                <div class="flex items-center gap-2.5">
                  <span class="w-9 h-9 rounded-xl bg-white border ${isFlawless ? 'border-emerald-200' : 'border-amber-200'} flex items-center justify-center text-lg">
                    ${isFlawless ? '🌟' : '🔄'}
                  </span>
                  <div>
                    <div class="text-[11px] font-extrabold uppercase ${isFlawless ? 'text-[#58A700]' : 'text-amber-700'}">Mistake Recovery</div>
                    <div class="text-xs font-extrabold ${isFlawless ? 'text-[#468700]' : 'text-amber-800'}">
                      ${isFlawless
                        ? 'Flawless — 0 mistakes!'
                        : `All ${lesson.recoveredMistakesCount} mistake${lesson.recoveredMistakesCount > 1 ? 's' : ''} corrected!`
                      }
                    </div>
                  </div>
                </div>
                <span class="px-2.5 py-1 rounded-xl text-xs font-extrabold ${isFlawless ? 'bg-[#58CC02] text-white' : 'bg-[#FF9600] text-white'}">
                  5/5 ✓
                </span>
              </div>
            </div>
          </div>

          <div class="space-y-2 pt-2">
            ${hasNextStage ? `
              <button type="button"
                      onclick="startStage('${lesson.topicId}', ${lesson.stageIndex + 1})"
                      class="w-full py-3.5 rounded-2xl font-extrabold text-sm uppercase tracking-wider text-white bg-[#58CC02] border-b-4 border-[#58A700] active:border-b-0 active:translate-y-1 transition-all">
                Next Stage →
              </button>
            ` : ''}
            <button type="button"
                    onclick="exitLesson()"
                    class="w-full py-3 rounded-2xl font-extrabold text-xs uppercase tracking-wider ${
                      hasNextStage
                        ? 'text-slate-600 bg-slate-100 hover:bg-slate-200'
                        : 'text-white bg-[#58CC02] border-b-4 border-[#58A700] active:border-b-0 active:translate-y-1'
                    } transition-all">
              Back to Syllabus
            </button>
          </div>
        </div>
      `;
    }

    function renderVocabModal() {
      if (!state.vocabModal.open) return '';
      const topic = findTopicById(state.vocabModal.topicId);
      if (!topic) return '';

      const itemsHtml = topic.vocab.length > 0
        ? topic.vocab.map(v => {
            const safeZh = v.zh.replace(/'/g, "\\'");
            const safeEn = v.en.replace(/'/g, "\\'");
            return `
              <div class="rounded-2xl border border-slate-200 bg-slate-50/70 p-3 flex items-center justify-between gap-2">
                <div class="min-w-0 flex-1">
                  <div class="flex items-baseline gap-2 flex-wrap">
                    <span class="font-zh font-black text-lg text-slate-800">${v.zh}</span>
                    ${state.showPinyin && v.py ? `<span class="text-xs font-bold text-[#1899D6]">${v.py}</span>` : ''}
                  </div>
                  <div class="text-xs font-extrabold text-slate-600 mt-0.5">${v.en}</div>
                </div>
                <div class="flex items-center gap-1 shrink-0">
                  <button type="button"
                          onclick="speakText('${safeZh}', 'zh-CN', false)"
                          class="px-2 py-1.5 rounded-xl bg-white border border-slate-200 text-[11px] font-extrabold text-slate-700 active:scale-95">
                    🔊 ZH
                  </button>
                  <button type="button"
                          onclick="speakText('${safeZh}', 'zh-CN', true)"
                          class="px-2 py-1.5 rounded-xl bg-white border border-slate-200 text-[11px] font-extrabold text-slate-700 active:scale-95">
                    🐢
                  </button>
                  <button type="button"
                          onclick="speakText('${safeEn}', 'en-US', false)"
                          class="px-2 py-1.5 rounded-xl bg-white border border-slate-200 text-[11px] font-extrabold text-slate-700 active:scale-95">
                    🔊 EN
                  </button>
                </div>
              </div>
            `;
          }).join('')
        : `<div class="text-center text-xs font-bold text-slate-400 py-8">No vocabulary items loaded yet.</div>`;

      return `
        <div class="absolute inset-0 z-30 bg-slate-900/50 backdrop-blur-2xs flex items-end sm:items-center justify-center p-4 animate-pop">
          <div class="w-full max-h-[85dvh] bg-white rounded-3xl border-2 border-slate-200 flex flex-col overflow-hidden shadow-xl">
            <div class="shrink-0 px-4 py-3.5 border-b border-slate-100 flex items-center justify-between gap-2">
              <div class="min-w-0">
                <div class="text-[10px] font-extrabold uppercase text-[#1899D6]">${topic.cefr} Core Dictionary</div>
                <div class="font-extrabold text-sm text-slate-800 truncate">${topic.en} · ${topic.zh}</div>
              </div>
              <button type="button"
                      onclick="closeVocabModal()"
                      class="w-8 h-8 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-600 font-extrabold flex items-center justify-center shrink-0">
                ✕
              </button>
            </div>

            <div class="flex-1 overflow-y-auto thin-scroll p-4 space-y-2">
              ${itemsHtml}
            </div>
          </div>
        </div>
      `;
    }

    function renderImporterModal() {
      if (!state.importer.open) return '';
      const imp = state.importer;
      const levelTopics = state.curriculum[imp.targetCefr] || [];
      const targetTopic = findTopicById(imp.targetTopicId) || levelTopics[0];
      const promptPreview = generateSyllabusPrompt();

      const levelOptions = CEFR_LEVELS.map(lvl => {
        const s = getLevelStats(lvl);
        return `<option value="${lvl}" ${lvl === imp.targetCefr ? 'selected' : ''}>${lvl} (${s.completedTopics}/${s.totalTopics} Topics)</option>`;
      }).join('');

      const topicOptions = levelTopics.map((t, i) => {
        const count = t.sentences.length;
        const mark = count >= TARGET_SENTENCES_PER_TOPIC ? '✓' : `${count}/20`;
        return `<option value="${t.id}" ${t.id === targetTopic.id ? 'selected' : ''}>#${i + 1} ${t.en} (${mark})</option>`;
      }).join('');

      return `
        <div class="absolute inset-0 z-30 bg-slate-900/50 backdrop-blur-2xs flex items-center justify-center p-4 animate-pop">
          <div class="w-full max-h-[90dvh] bg-white rounded-3xl border-2 border-slate-200 flex flex-col overflow-hidden shadow-xl">
            <!-- Modal Header -->
            <div class="shrink-0 px-4 py-3 border-b border-slate-100 flex items-center justify-between gap-2">
              <div>
                <div class="font-display font-black text-base text-slate-800">Auto-Advancing Syllabus Builder</div>
                <div class="text-[11px] font-bold text-slate-400">Copy prompt → Generate in Gemini → Paste JSON</div>
              </div>
              <button type="button"
                      onclick="closeImporter()"
                      class="w-8 h-8 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-600 font-extrabold flex items-center justify-center shrink-0">
                ✕
              </button>
            </div>

            <!-- Modal Body -->
            <div class="flex-1 overflow-y-auto thin-scroll p-4 space-y-3">
              ${imp.statusMsg ? `
                <div class="p-3 rounded-2xl text-xs font-extrabold border ${
                  imp.statusMsg.type === 'success'
                    ? 'bg-emerald-50 border-emerald-200 text-[#58A700]'
                    : 'bg-rose-50 border-rose-200 text-[#EA2B2B]'
                }">
                  ${imp.statusMsg.text}
                </div>
              ` : ''}

              <!-- Target Selector -->
              <div class="grid grid-cols-3 gap-2">
                <div>
                  <label class="block text-[10px] font-extrabold uppercase text-slate-400 mb-1">CEFR Level</label>
                  <select onchange="setImporterCefr(this.value)"
                          class="w-full rounded-xl border-2 border-slate-200 bg-slate-50 px-2.5 py-2 text-xs font-extrabold text-slate-700 focus:border-[#1CB0F6] focus:outline-none">
                    ${levelOptions}
                  </select>
                </div>
                <div class="col-span-2">
                  <label class="block text-[10px] font-extrabold uppercase text-slate-400 mb-1">Target Topic</label>
                  <select onchange="setImporterTopic(this.value)"
                          class="w-full rounded-xl border-2 border-slate-200 bg-slate-50 px-2.5 py-2 text-xs font-extrabold text-slate-700 focus:border-[#1CB0F6] focus:outline-none">
                    ${topicOptions}
                  </select>
                </div>
              </div>

              <!-- Step 1: Copy Generated Prompt -->
              <div class="rounded-2xl border border-slate-200 bg-slate-50 p-3">
                <div class="flex items-center justify-between gap-2 mb-1.5">
                  <span class="text-xs font-extrabold text-slate-700">1. Gemini Prompt (${targetTopic.sentences.length}/20 filled)</span>
                  <button type="button"
                          onclick="handleCopyPrompt()"
                          class="px-3 py-1.5 rounded-xl font-extrabold text-xs transition-all ${
                            imp.copiedPrompt
                              ? 'bg-[#58CC02] text-white'
                              : 'bg-[#1CB0F6] border-b-2 border-[#1899D6] text-white active:translate-y-0.5'
                          }">
                    ${imp.copiedPrompt ? '✓ Copied!' : '📋 Copy Prompt'}
                  </button>
                </div>
                <pre class="text-[10px] leading-relaxed text-slate-600 bg-white border border-slate-200 rounded-xl p-2.5 max-h-24 overflow-y-auto thin-scroll whitespace-pre-wrap font-mono">${promptPreview.replace(/</g, '&lt;')}</pre>
              </div>

              <!-- Step 2: Paste JSON & Import -->
              <div class="rounded-2xl border border-slate-200 bg-slate-50 p-3">
                <label class="block text-xs font-extrabold text-slate-700 mb-1.5">2. Paste Gemini JSON Output</label>
                <textarea oninput="state.importer.rawJson = this.value"
                          rows="4"
                          placeholder='Paste {"cefr": "${targetTopic.cefr}", "topicId": "${targetTopic.id}", "vocab": [...], "sentences": [...]}'
                          class="w-full rounded-xl border-2 border-slate-200 bg-white p-2.5 text-xs font-mono text-slate-700 focus:border-[#58CC02] focus:outline-none">${imp.rawJson}</textarea>

                <button type="button"
                        onclick="importSyllabusJson()"
                        class="mt-2 w-full py-3 rounded-2xl bg-[#58CC02] border-b-4 border-[#58A700] text-white font-extrabold text-xs uppercase tracking-wider active:border-b-0 active:translate-y-1 transition-all">
                  ⚡ Import & Fill Topic
                </button>
              </div>

              <!-- Backup & Reset Footer -->
              <div class="pt-1 flex items-center justify-between gap-2">
                <button type="button"
                        onclick="exportBackupJson()"
                        class="px-3 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-600 font-extrabold text-[11px]">
                  📤 Export Backup
                </button>

                ${!imp.confirmReset ? `
                  <button type="button"
                          onclick="triggerResetConfirm()"
                          class="px-3 py-2 rounded-xl bg-rose-50 hover:bg-rose-100 text-[#EA2B2B] font-extrabold text-[11px]">
                    ↺ Reset
                  </button>
                ` : `
                  <div class="flex items-center gap-1.5">
                    <button type="button"
                            onclick="executeFactoryReset()"
                            class="px-2.5 py-1.5 rounded-xl bg-[#FF4B4B] text-white font-extrabold text-[11px]">
                      Confirm Reset
                    </button>
                    <button type="button"
                            onclick="cancelResetConfirm()"
                            class="px-2.5 py-1.5 rounded-xl bg-slate-200 text-slate-700 font-extrabold text-[11px]">
                      Cancel
                    </button>
                  </div>
                `}
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function selectCefrLevel(lvl) {
      SFX.tap();
      state.cefr = lvl;
      saveState();
      render();
    }

    function togglePinyin() {
      SFX.tap();
      state.showPinyin = !state.showPinyin;
      saveState();
      render();
    }

    function toggleSound() {
      state.soundEnabled = !state.soundEnabled;
      if (state.soundEnabled) SFX.tap();
      saveState();
      render();
    }

    function openVocabModal(topicId) {
      SFX.tap();
      state.vocabModal = { open: true, topicId };
      render();
    }

    function closeVocabModal() {
      SFX.tap();
      state.vocabModal.open = false;
      render();
    }

    function render() {
      const app = document.getElementById('app');
      if (!app) return;

      let screenHtml = '';
      if (state.screen === 'home') {
        screenHtml = renderHome();
      } else if (state.screen === 'lesson') {
        screenHtml = renderLesson();
      } else if (state.screen === 'complete') {
        screenHtml = renderComplete();
      }

      const toastHtml = state.toast ? `
        <div class="absolute top-14 inset-x-5 z-40 px-3.5 py-2.5 rounded-2xl bg-slate-800 text-white text-xs font-extrabold text-center shadow-lg animate-pop">
          ${state.toast.text}
        </div>
      ` : '';

      app.innerHTML = `
        ${screenHtml}
        ${renderVocabModal()}
        ${renderImporterModal()}
        ${toastHtml}
      `;
    }

    /* =========================================================================
       9. BOOTSTRAP
       ========================================================================= */
    window.addEventListener('DOMContentLoaded', () => {
      loadState();
      render();
    });
  </script>
</body>
</html>
```
